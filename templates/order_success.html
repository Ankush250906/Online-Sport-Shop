<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Successful - SportShop</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        🏆 SportShop
    </div>

</nav>


<section class="success-section">

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>
            Order Placed Successfully!
        </h1>

        <p>
            Thank you for shopping with SportShop.
        </p>

        <p>
            Your Order ID:
            <strong>
                #{{ order_id }}
            </strong>
        </p>


        <div class="success-buttons">

            <a
                href="/products"
                class="btn">

                Continue Shopping

            </a>

            <a
                href="/"
                class="btn">

                Go Home

            </a>

        </div>

    </div>

</section>


<script>

localStorage.removeItem(
    "sportshop_cart"
);

</script>

</body>

</html>
