<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - SportShop</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin.css') }}">

</head>

<body>

<div class="admin-login-container">

    <div class="admin-login-card">

        <div class="admin-logo">

            <div class="icon">
                🛡️
            </div>

            <h1>Admin Login</h1>

            <p>SportShop Administration</p>

        </div>


        <form method="POST">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn">

                Login to Dashboard

            </button>

        </form>


        <div class="back-home">

            <a href="/">
                ← Back to SportShop
            </a>

        </div>

    </div>

</div>

</body>

</html>
