<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - SportShop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>
.checkout-section{background:#f5f7fb;padding:50px 20px;min-height:calc(100vh - 140px)}
.checkout-container{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:28px;align-items:start}
.checkout-form-card,.order-summary-card{background:#fff;border-radius:16px;padding:30px;box-shadow:0 8px 30px rgba(0,0,0,.08);border:1px solid #e7eaf0}
.checkout-form-card h1{margin:0 0 8px;font-size:34px;color:#111827}
.checkout-form-card>p{margin:0 0 25px;color:#6b7280}
#checkoutForm{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form-group{min-width:0}
.form-group.full-width{grid-column:1/-1}
.form-group label{display:block;font-weight:600;color:#374151;margin-bottom:7px;font-size:15px}
.form-group input,.form-group textarea,.form-group select{display:block;width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #d1d5db;border-radius:9px;background:#fff;color:#111827;font-size:15px;font-family:inherit;outline:none;transition:.2s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}
.form-group textarea{min-height:110px;resize:vertical}
.checkout-btn{grid-column:1/-1;width:100%;border:0;border-radius:10px;padding:14px 18px;background:#111827;color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:2px;transition:.2s}
.checkout-btn:hover{background:#1f2937;transform:translateY(-1px)}
.checkout-btn:disabled{opacity:.65;cursor:not-allowed;transform:none}
.order-summary-card h2{margin:0 0 20px;color:#111827;font-size:24px}
#checkoutItems{display:flex;flex-direction:column;gap:12px}
.summary-item{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #e5e7eb;color:#374151;font-size:15px}
.checkout-total{display:flex;justify-content:space-between;margin-top:20px;padding-top:18px;border-top:2px solid #111827;font-size:19px;color:#111827}
@media(max-width:800px){.checkout-container{grid-template-columns:1fr}.order-summary-card{order:2}}
@media(max-width:600px){.checkout-section{padding:25px 12px}.checkout-form-card,.order-summary-card{padding:20px;border-radius:12px}#checkoutForm{grid-template-columns:1fr;gap:15px}.form-group.full-width{grid-column:1}.checkout-form-card h1{font-size:28px}}
</style>
</head>
<body>

<nav class="navbar">
    <div class="logo">SportShop</div>
    <div class="nav-links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('products') }}">Products</a>
        <a href="{{ url_for('cart') }}">Cart 🛒</a>
        {% if session.get('user_id') %}
            <a href="{{ url_for('orders') }}">My Orders</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        {% else %}
            <a href="{{ url_for('login') }}">Login</a>
        {% endif %}
    </div>
</nav>

<section class="checkout-section">
    <div class="checkout-container">

        <div class="checkout-form-card">
            <h1>Checkout</h1>
            <p>Enter your delivery details.</p>

            <form id="checkoutForm" method="POST" action="{{ url_for('checkout') }}">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" maxlength="10" placeholder="10-digit mobile number" required>
                </div>

                <div class="form-group full-width">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" placeholder="Enter your complete delivery address" required></textarea>
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" placeholder="Enter city" required>
                </div>

                <div class="form-group">
                    <label for="pincode">Pincode</label>
                    <input type="text" id="pincode" name="pincode" maxlength="6" placeholder="6-digit pincode" required>
                </div>

                <div class="form-group full-width">
                    <label for="payment_method">Payment Method</label>
                    <select name="payment_method" id="payment_method" required>
                        <option value="">Select Payment Method</option>
                        <option value="COD">Cash on Delivery</option>
                        <option value="UPI">UPI / Online Payment</option>
                    </select>
                </div>

                <input type="hidden" name="cart_data" id="cart_data">

                <button type="submit" id="placeOrderBtn" class="checkout-btn">
                    Place Order
                </button>
            </form>
        </div>

        <div class="order-summary-card">
            <h2>Order Summary</h2>
            <div id="checkoutItems"></div>
            <div class="checkout-total">
                <strong>Total:</strong>
                <strong>₹<span id="checkoutTotal">0.00</span></strong>
            </div>
        </div>

    </div>
</section>

<footer class="footer">
    <p>© 2026 SportShop. All Rights Reserved.</p>
</footer>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
const cart = JSON.parse(localStorage.getItem("sportshop_cart")) || [];

function getTotal() {
    return cart.reduce(
        (total, item) => total + Number(item.price) * Number(item.quantity),
        0
    );
}

function displayCheckout() {
    const container = document.getElementById("checkoutItems");
    const totalElement = document.getElementById("checkoutTotal");

    if (!cart.length) {
        container.innerHTML = "<p>Your cart is empty.</p>";
        totalElement.textContent = "0.00";
        return;
    }

    container.innerHTML = cart.map(item => `
        <div class="summary-item">
            <span>${item.name} × ${item.quantity}</span>
            <span>₹${(Number(item.price) * Number(item.quantity)).toFixed(2)}</span>
        </div>
    `).join("");

    totalElement.textContent = getTotal().toFixed(2);
}

async function startUPIPayment(form) {
    const button = document.getElementById("placeOrderBtn");

    if (!cart.length) {
        alert("Your cart is empty!");
        return;
    }

    button.disabled = true;
    button.textContent = "Starting Payment...";

    try {
        const response = await fetch("/create-razorpay-order", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({cart: cart})
        });

        const data = await response.json();

        console.log("Razorpay order response:", data);

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Unable to create Razorpay order.");
        }

        if (typeof Razorpay === "undefined") {
            throw new Error("Razorpay Checkout could not load. Check your internet connection.");
        }

        const options = {
            key: data.key_id,
            amount: data.amount,
            currency: data.currency,
            name: "SportShop",
            description: "SportShop Online Order",
            order_id: data.order_id,

            prefill: {
                name: form.name.value,
                contact: form.phone.value
            },

            theme: {
                color: "#111827"
            },

            handler: async function(payment) {
                try {
                    const verifyResponse = await fetch("/payment-success", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({
                            razorpay_order_id: payment.razorpay_order_id,
                            razorpay_payment_id: payment.razorpay_payment_id,
                            razorpay_signature: payment.razorpay_signature
                        })
                    });

                    const result = await verifyResponse.json();

                    if (verifyResponse.ok && result.success) {
                        localStorage.removeItem("sportshop_cart");
                        window.location.href = "/order-success/" + result.order_id;
                    } else {
                        throw new Error(result.message || "Payment verification failed.");
                    }
                } catch (error) {
                    alert(error.message);
                    button.disabled = false;
                    button.textContent = "Place Order";
                }
            }
        };

        const razorpay = new Razorpay(options);

        razorpay.on("payment.failed", function(response) {
            console.error("Payment failed:", response);
            alert(
                response.error && response.error.description
                    ? response.error.description
                    : "Payment failed."
            );
            button.disabled = false;
            button.textContent = "Place Order";
        });

        razorpay.open();

    } catch (error) {
        console.error("Payment error:", error);
        alert(error.message || "Unable to start payment.");
        button.disabled = false;
        button.textContent = "Place Order";
    }
}

document.getElementById("checkoutForm").addEventListener("submit", function(event) {
    event.preventDefault();

    if (!cart.length) {
        alert("Your cart is empty!");
        return;
    }

    const form = this;
    const paymentMethod = document.getElementById("payment_method").value;

    if (!paymentMethod) {
        alert("Please select a payment method.");
        return;
    }

    document.getElementById("cart_data").value = JSON.stringify(cart);

    if (paymentMethod === "UPI") {
        startUPIPayment(form);
        return;
    }

    if (paymentMethod === "COD") {
        form.submit();
    }
});

displayCheckout();
</script>

</body>
</html>
